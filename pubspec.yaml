name: bookio
description: "A new Flutter project."

# Empêcher la publication accidentelle sur pub.dev
publish_to: 'none'

# Version de l'application
version: 1.0.0+1

# Définition de l'environnement SDK
environment:
  sdk: ^3.7.0

# Dépendances du projet
dependencies:



  flutter:
    sdk: flutter
  


  

  # Icônes Cupertino pour iOS
  cupertino_icons: ^1.0.8
  # Firebase
  shared_preferences: ^2.2.0
  http: ^0.13.6 # Pour envoyer des requêtes HTTP à ImgBB et File.io
  firebase_core: ^3.12.0
  firebase_auth: ^5.5.1
  cloud_firestore: ^5.6.5
  cloud_functions: ^5.3.3
  image_picker: ^1.1.2
  firebase_storage: ^12.4.4
  intl: ^0.18.0
  flutter_feather_icons: ^2.0.0
  shimmer: ^3.0.0
  record: ^5.0.4
  audioplayers: ^5.2.1
  # Autres dépendances utiles
  async: ^2.12.0
  flutter_pdfview: ^1.2.7
  flutter_cache_manager: ^3.3.0
  fake_async: ^1.3.2
  leak_tracker: ^10.0.8
  material_color_utilities: ^0.11.1
  vm_service: ^14.3.1
  image: ^4.5.3
  path_provider: ^2.1.5
  file_picker: ^9.1.0
  dio: ^5.8.0+1
  url_launcher: ^6.3.1
  open_file: ^3.5.10
  audio_waveforms: ^1.3.0
  cached_network_image: ^3.2.3
  badges: ^3.0.0 
  shelf: ^1.4.0 
  flutter_riverpod: ^2.6.1
  
# Dépendances pour les tests
dev_dependencies:
  flutter_test:
    sdk: flutter

  # Bonnes pratiques de code (Linting)
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  # 📌 Ajouter l'image du Splash Screen
  assets:
    - lib/assets/images/playstore.png
    - lib/assets/images/first_image.png
    - lib/assets/images/second_image.png
    - lib/assets/images/login_background.png